aid: newswhip
name: NewsWhip
description: >-
  NewsWhip is a media intelligence and predictive analytics company whose API gives programmatic
  access to the world's largest human-engagement database — real-time and predicted social
  engagement metrics, aggregated statistics, publisher and regional rankings, and top influencers
  for hundreds of millions of articles and social posts it has tracked across the web, Facebook and
  Twitter since 2014. Developers query trending and predicted content, look up engagement for
  specific URLs, and surface the pages and accounts driving a story via a JSON HTTPS API documented
  on the NewsWhip Developer Hub. Added to the API Evangelist network as a portfolio company of 500
  Global and enriched by the API Evangelist pipeline from NewsWhip's public developer surface.
