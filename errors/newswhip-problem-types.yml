    The `id` is a per-request UUID useful when contacting support.
notes: >-
  Errors are plain JSON with an HTTP status code — not RFC 9457 application/problem+json,
  and with no machine-readable error code of their own. The published error reference
  documents five statuses; the OpenAPI declares only 400 per operation, so the catalog
  below is broader than the spec. Note one real discrepancy: the docs assign missing or
  invalid keys to 403, and the live API confirms it returns 403 (not 401) when no key is
  passed. Clients written against the older 401 assumption will mis-handle auth failures.
problems:
- status: 400
  title: Bad Request
  description: >-
    Your request could not be parsed. The text of the response describes the reason the
    request could not be parsed.
  remediation: >-
    Check required path and query parameters, and validate the JSON filter body. Escape
    reserved Lucene characters (notably `"`) inside filter strings.
  docs: https://developer.newswhip.com/docs/errors
  source: docs
- status: 403
  title: Forbidden
  description: >-
    Your API key is not allowed to access this resource, or your API key is expired or
    invalid. Also returned when no key is passed at all.
  remediation: >-
    Supply a valid `key` query parameter. Confirm the key is entitled to the product tier
    the endpoint belongs to (Quick Start / Historical / Syndication).
  docs: https://developer.newswhip.com/docs/authentication
  source: docs+probe
  observed_message: No API key was passed with this request.
- status: 429
  title: Too Many Requests
  description: 'Enhance your calm! or contact us for higher limits!'
  remediation: >-
    Back off. The limit is 100 requests per rolling 5 minutes with a 5 requests/second
    ceiling. Collapse near-identical consecutive queries into one using Lucene `OR`
    operators, or contact NewsWhip for higher limits.
  docs: https://developer.newswhip.com/docs/rate-limits
  ref: rate-limits/newswhip-rate-limits.yml
  source: docs
- status: 500
  title: Internal Server Error
  description: NewsWhip had a problem with its server.
  remediation: Retry later with backoff.
  docs: https://developer.newswhip.com/docs/errors
  source: docs
- status: 503
  title: Service Unavailable
  description: Temporarily offline for maintenance.
  remediation: Retry later with backoff.
  docs: https://developer.newswhip.com/docs/errors
  source: docs
retry_guidance:
  retryable:
  - 429
  - 500
  - 503
  not_retryable:
  - 400
  - 403
  retry_after_header: false
  note: >-
    No Retry-After header is documented or observed, so clients must implement their own
    backoff. Retries are safe on every endpoint — the whole API is read-only, including
    the POST query endpoints. See conventions/newswhip-conventions.yml.
