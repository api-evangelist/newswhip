summary: >-
  NewsWhip has both a real MCP endpoint and a real OpenAPI surface, but they cannot be
  bound to one another from outside. The MCP server at https://developer.newswhip.com/mcp
  answers tools/list with HTTP 401 "Authorization required", and NewsWhip publishes no
  tool manifest anywhere else (its /llms.txt is a documentation index, not a tool list).
  Zero tool names are therefore known, so zero crosswalk rows exist. Mapping anything here
  would be invention. What this file does record honestly is the full REST surface that is
  currently unbound to any known tool, plus the exact gate that prevents the binding.
